<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELA.6.R.1.3 Multiple Narrators and the Speaker in Poetry</title>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#172554;--bg:#eaf1fb;--line:#c9d6ea;--teal:#0d9488;--sun:#facc15}
*{box-sizing:border-box}body{margin:0;font-family:Lexend,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
.wrap{max-width:820px;margin:0 auto;padding:20px 14px 40px}
header{background:var(--ink);color:#fff;border-radius:16px;padding:22px;margin-bottom:14px}
header h1{margin:0 0 4px;font-size:clamp(1.3rem,4vw,1.9rem)}header p{margin:0;opacity:.85;font-size:.9rem}
main{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px}
h3{margin:20px 0 6px}ol{padding-left:22px}li{margin:6px 0}
button{font:inherit;cursor:pointer;color:inherit}button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.pass{background:var(--bg);border-left:6px solid var(--sun);border-radius:8px;padding:14px 16px;font-size:1.05rem;margin:10px 0}
.think{background:#ccfbf1;border-radius:10px;padding:12px 14px;margin-top:10px}
.btn{background:var(--ink);color:#fff;border:0;border-radius:10px;padding:10px 18px;margin-top:10px}
.btn.alt{background:#fff;color:var(--ink);border:2px solid var(--ink)}
.meta{font-size:.85rem;opacity:.7;margin:0}.opts{display:grid;gap:8px;margin:10px 0}
.opt{text-align:left;background:#fff;border:2px solid var(--line);border-radius:10px;padding:12px}
.opt:hover:not(:disabled){border-color:var(--teal)}.opt.ok{background:#dcfce7;border-color:#16a34a}.opt.no{background:#fee2e2;border-color:#dc2626}
.fb{border-radius:8px;padding:10px;margin:8px 0}.fb.ok{background:#dcfce7}.fb.no{background:#fef9c3}.done{text-align:center}
</style></head><body><div class="wrap">
<header><h1>Multiple Narrators and the Speaker in Poetry</h1><p>ELA.6.R.1.3: Explain the influence of multiple narrators and/or shifts in point of view in a literary text.</p></header>
<main aria-live="polite"><p class="goal" id="goal"></p><h3>How to do it</h3><ol id="steps"></ol>
<h3>Watch a reader think</h3><div class="pass" id="pass"></div><button class="btn" id="show">Show how a reader thinks</button><div id="think"></div>
<h3>Your turn</h3><div id="prac"></div></main></div>
<script>
/* ===== EDIT CONTENT HERE: goal, steps, p (example), think, tip, qs (c = optional passage for that question) ===== */
const L={"goal": "Explain how different narrators change what the reader learns, and identify the speaker in a poem.", "steps": ["Find who is telling each part. Look for names and the pronouns I, me, and my.", "Compare what each narrator knows, feels, and says about the same event.", "In a poem, the speaker is the voice talking. Use clues to decide who the speaker is."], "p": "<b>Dev:</b> I knew my science fair project was ruined when the volcano sprayed foam on the judge.<br><b>Ms. Ortiz:</b> I only saw a clever boy who stayed calm and kept explaining while the foam flew.", "think": "Dev thinks the event was a disaster. Ms. Ortiz saw it as impressive. Two narrators show the same event two ways, and I learn something Dev could not know: the judge was not upset.", "tip": "Compare what each narrator thinks about the same event.", "qs": [{"q": "How do the two narrators see the event differently?", "a": "Dev thinks it was a disaster, but Ms. Ortiz was impressed", "o": ["Dev thinks it was a disaster, but Ms. Ortiz was impressed", "They both think it was funny", "They both think it was a disaster", "Neither saw what happened"], "e": "Each narrator's view shows a different side."}, {"q": "Why might the author use two narrators?", "a": "To show the same event from different points of view", "o": ["To show the same event from different points of view", "To make the story shorter", "To avoid using pronouns", "To change the setting"], "e": "Multiple narrators reveal what one narrator cannot know."}, {"q": "Who is the speaker in this poem?", "a": "Someone waiting up for a person who has not come home", "o": ["Someone waiting up for a person who has not come home", "A car driver", "The porch light", "The poet's teacher"], "e": "Clues: \"counting the cars that aren't his\" and \"keep it on, just in case.\"", "c": "I wait at the window each night,<br>counting the cars that aren't his.<br>The porch light hums its small yellow song,<br>and I keep it on, just in case."}, {"q": "Which clue shows the speaker's feelings in the poem?", "a": "\"I keep it on, just in case\"", "o": ["\"I keep it on, just in case\"", "\"The porch light hums\"", "\"each night\"", "\"yellow song\""], "e": "It shows hope and worry. The speaker is not necessarily the poet.", "c": "I wait at the window each night,<br>counting the cars that aren't his.<br>The porch light hums its small yellow song,<br>and I keep it on, just in case."}]};
const $=id=>document.getElementById(id);
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
$('goal').textContent=L.goal;$('steps').innerHTML=L.steps.map(s=>'<li>'+s+'</li>').join('');$('pass').innerHTML=L.p;
$('show').onclick=()=>{$('think').innerHTML='<div class="think">💭 '+L.think+'</div>';$('show').hidden=true};
function prac(qi,firsts){
  const box=$('prac');
  if(qi>=L.qs.length){box.innerHTML='<div class="done"><h3>Practice complete!</h3><p>You got '+firsts+' of '+L.qs.length+' on the first try.</p><button class="btn" id="rt">Try again</button></div>';$('rt').onclick=()=>prac(0,0);return}
  const q=L.qs[qi],opts=shuffle(q.o);let tries=0,solved=false;
  box.innerHTML='<p class="meta">Question '+(qi+1)+' of '+L.qs.length+'</p>'+(q.c?'<div class="pass">'+q.c+'</div>':'')+'<p><b>'+q.q+'</b></p><div class="opts">'+opts.map((o,k)=>'<button class="opt" data-k="'+k+'">'+o+'</button>').join('')+'</div><div id="fb"></div><button class="btn" id="nq" hidden>'+(qi+1<L.qs.length?'Next question':'Finish')+'</button>';
  box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(solved)return;tries++;const ok=opts[b.dataset.k]===q.a;
    if(ok){solved=true;b.classList.add('ok');box.querySelectorAll('.opt').forEach(o=>o.disabled=true);$('fb').innerHTML='<div class="fb ok">✓ Correct! '+q.e+'</div>';$('nq').hidden=false}
    else{b.classList.add('no');b.disabled=true;$('fb').innerHTML='<div class="fb no">Not quite. Hint: '+L.tip+' Try another answer.</div>'}});
  $('nq').onclick=()=>prac(qi+1,firsts+(tries===1?1:0));
}
prac(0,0);
</script></body></html>
